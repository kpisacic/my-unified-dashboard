services:
  dhmz-weather:
    build:
      context: "../dhmz-weather-dashboard"
      dockerfile: backend/Dockerfile
    container_name: dhmz-weather
    environment:
      DHMZ_STATION_NAME: "Zagreb-Maksimir"
      DHMZ_FORECAST_REGION_NAME: "Zagreb"
      DHMZ_FORECAST_TEXT: "zg_text"
      DHMZ_FORECAST_STATION_NAME: "ZAGREB-MAKSIMIR"
      DHMZ_TIMEZONE: "Europe/Zagreb"
      DHMZ_WEATHER_CACHE_SECONDS: "1800"
      DHMZ_RADAR_CACHE_SECONDS: "600"
      DHMZ_MARK_LOCATION: "false"
      DHMZ_RADAR_FORMAT: "GIF"
    volumes:
      - ./data/dhmz:/data
    restart: unless-stopped
    # No host port published - only the dashboard (nginx) talks to this,
    # over the internal compose network.

  eko-karta-zagreb:
    build:
      context: "../eko-karta-zagreb-standalone"
    container_name: eko-karta-zagreb
    environment:
      DEFAULT_STATION_ID: "969"
      REFRESH_INTERVAL_SECONDS: "300"
      DATA_CACHE_TTL_SECONDS: "300"
    mem_limit: 64m
    restart: unless-stopped

  stampar-pelud:
    build:
      context: "../stampar-pelud-standalone"
    container_name: stampar-pelud
    environment:
      STAMPAR_STATION_ID: "26"
      REFRESH_INTERVAL_SECONDS: "1800"
      ICON_STYLE: "pictogram"
      ACTIVE_ONLY: "true"
    mem_limit: 128m
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: wall-dashboard
    ports:
      - "8090:80"
    environment:
      # Basic Auth for the /docker-api/ proxy (see nginx.conf) - a home-LAN
      # speed bump, not real security (the password ships in the
      # dashboard's own JS - see docker-entrypoint.sh). Override both in a
      # .env file; the checked-in defaults are placeholders.
      DOCKER_STATUS_USER: "dashboard"
      DOCKER_STATUS_PASSWORD: "${DOCKER_STATUS_PASSWORD:-changeme}"
      # docker-entrypoint.sh adds nginx's own user to a group with this
      # GID before nginx starts - a plain docker-compose `group_add` does
      # NOT work here, since nginx's worker processes (which is what
      # actually handles the /docker-api/ proxy, not the root master) drop
      # to the unprivileged "nginx" user via nginx's own `user` directive,
      # which resets supplementary groups to whatever's in /etc/group
      # (confirmed - group_add alone left workers with only their own
      # group). Override via a .env file if
      # `stat -c '%g' /var/run/docker.sock` prints something other than 987
      # on your host.
      DOCKER_SOCK_GID: "${DOCKER_SOCK_GID:-987}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - dhmz-weather
      - eko-karta-zagreb
      - stampar-pelud
    restart: unless-stopped
