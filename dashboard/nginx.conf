server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DHMZ weather backend (FastAPI/uvicorn on :8000 inside the compose network)
    location /api/dhmz/ {
        proxy_pass http://dhmz-weather:8000/api/;
        proxy_set_header Host $host;
    }

    # Eko Karta Zagreb backend (stdlib http.server on :8080)
    location /api/eko/ {
        proxy_pass http://eko-karta-zagreb:8080/api/;
        proxy_set_header Host $host;
    }

    # Stampar Pelud backend (stdlib http.server on :8080)
    location /api/pollen/ {
        proxy_pass http://stampar-pelud:8080/api/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
