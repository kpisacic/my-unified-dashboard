# Docker Engine API over its Unix socket - used only by the /docker-api/
# location below, never exposed as-is (see that location's comment).
upstream docker_api {
    server unix:/var/run/docker.sock;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DHMZ weather backend (stdlib http.server on :8000 inside the compose network)
    location /api/dhmz/ {
        proxy_pass http://dhmz-weather:8000/api/;
        proxy_set_header Host $host;
    }

    # Eko Karta Zagreb backend (stdlib http.server on :8080)
    location /api/eko/ {
        proxy_pass http://eko-karta-zagreb:8080/api/;
        proxy_set_header Host $host;
    }

    # Stampar Pelud backend (stdlib http.server on :8080)
    location /api/pollen/ {
        proxy_pass http://stampar-pelud:8080/api/;
        proxy_set_header Host $host;
    }

    # Container-status dots in the top status bar. Two layers of
    # restriction, in order of how much they actually matter:
    #  1. The regex is anchored (^...$) and only matches "inspect one of
    #     these five named containers" (GET .../containers/<name>/json) -
    #     never the rest of the Docker API (no list-all, no images/
    #     volumes/networks, no create/exec/delete). This is the real
    #     protection: even a leaked password only ever grants a read-only
    #     inspect of exactly these containers.
    #  2. Basic Auth on top of that - a speed bump against casual LAN
    #     discovery, not real security (the password ships in the
    #     dashboard's own JS - see runtime-config.js /
    #     docker-entrypoint.sh). Fine for a home LAN; don't rely on it
    #     for anything that actually needs to be secure.
    location ~ ^/docker-api/containers/(dhmz-weather|eko-karta-zagreb|stampar-pelud|wall-dashboard)/json$ {
        limit_except GET { deny all; }
        auth_basic "docker status";
        auth_basic_user_file /etc/nginx/.htpasswd;
        rewrite ^/docker-api(/.*)$ $1 break;
        proxy_pass http://docker_api;
    }

    location / {
        # No Cache-Control was set here before, so browsers fell back to
        # heuristic caching (guessing a freshness window from Last-Modified)
        # and could silently keep serving an old CSS/JS/HTML build without
        # even asking the server - confirmed while debugging this exact
        # thing. "no-cache" still lets the browser skip a re-download via a
        # conditional GET (ETag/Last-Modified, a 304 when unchanged) - it
        # just stops it from ever assuming a cached copy is fresh on its
        # own. Matters most on a wall tablet whose browser tab may stay
        # open for weeks between dashboard updates.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
